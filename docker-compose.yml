# Local Postgres for running smart-task-ai without Supabase.
# Usage:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: stai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - stai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stai_pgdata:
